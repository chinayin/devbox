name: Test

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test-install-official:
    name: Install (Official Sources)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install vibecoding
        run: ./devbox-mac.sh install --vibecoding

      - name: Verify installations
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)" || eval "$(/usr/local/bin/brew shellenv)" || true
          brew --version
          python3 --version
          echo "Node.js $(node --version 2>/dev/null)"
          echo "npm $(npm --version 2>/dev/null)"

      - name: Check status after install
        run: ./devbox-mac.sh status

  test-install-china-config:
    name: Install China (Config Only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install with --china flag
        run: ./devbox-mac.sh install --china --vibecoding

      - name: Verify mirror configs
        run: |
          echo "==> Checking pip config"
          cat ~/.pip/pip.conf
          grep -q "tuna.tsinghua.edu.cn" ~/.pip/pip.conf

          echo "==> Checking npm config"
          eval "$(/opt/homebrew/bin/brew shellenv)" || eval "$(/usr/local/bin/brew shellenv)" || true
          npm config get registry | grep -q "npmmirror.com"

          echo "==> Checking shell rc for Homebrew mirror"
          RC_FILE="${HOME}/.zshrc"
          [[ ! -f "$RC_FILE" ]] && RC_FILE="${HOME}/.bash_profile"
          [[ ! -f "$RC_FILE" ]] && RC_FILE="${HOME}/.profile"
          cat "$RC_FILE"
          grep -q "HOMEBREW_BOTTLE_DOMAIN" "$RC_FILE"

      - name: Check status
        run: ./devbox-mac.sh status

  test-install-languages:
    name: Install All Languages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Go and Rust
        run: ./devbox-mac.sh install --go --rust

      - name: Verify installations
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)" || eval "$(/usr/local/bin/brew shellenv)" || true
          [[ -f "$HOME/.cargo/env" ]] && source "$HOME/.cargo/env"
          go version
          rustc --version
          cargo --version

      - name: Final status
        run: ./devbox-mac.sh status
